# Runs the whole app locally with one command: docker compose up
# Then open http://localhost:5173. See "Run with Docker" in the README.

services:
  # A local PostgreSQL, so you don't need the shared Supabase database (and can't break it).
  instrument-db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      # Only reachable from your own computer, so a simple password is fine here. Never use it anywhere else.
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: instrument
    volumes:
      # The data is kept in this volume, so it survives "docker compose down". "docker compose down -v" deletes it.
      - db-data:/var/lib/postgresql/data
    ports:
      # Lets you open the database with a tool on your computer (psql, DBeaver...) at localhost:5433.
      # 5433, not the usual 5432, so it doesn't clash with a Postgres already running on your computer.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d instrument"]
      interval: 2s
      timeout: 5s
      retries: 15

  # Runs the migrations, then stops. On "docker compose up" it runs the ones that haven't run yet, before the server starts.
  # By hand: "docker compose run --rm instrument-migrate" (all that haven't run) or "docker compose run --rm instrument-migrate 003" (only 003).
  instrument-migrate:
    # The postgres image, only because it has psql.
    image: postgres:17
    entrypoint: ["sh", "/scripts/migrate.sh"]
    environment:
      # psql reads the connection from these variables.
      PGHOST: instrument-db
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: instrument
      # Hide Postgres' info messages (like "already exists, skipping"); errors still show.
      PGOPTIONS: "-c client_min_messages=warning"
    volumes:
      - ./packages/server/migrations:/migrations:ro
      - ./scripts/migrate.sh:/scripts/migrate.sh:ro
    depends_on:
      instrument-db:
        condition: service_healthy

  instrument-server:
    # Builds the development image (see Dockerfile) and names it, so "instrument-web" reuses it instead of building it again.
    build: .
    image: instrument-dev
    command: npm run dev -w @instrument/server
    environment:
      # These win over packages/server/.env, so the server uses the local database, not Supabase.
      DATABASE_URL: postgresql://postgres:postgres@instrument-db:5432/instrument
      # The local database has no SSL (Supabase needs it, so SSL stays on by default).
      DATABASE_SSL: "false"
      # Listen on every network of the container, so the "instrument-web" container can reach it.
      HOST: 0.0.0.0
    volumes: &source
      # Your code, mounted live: saving a file reloads the app.
      - .:/app
      # Keep the dependencies installed in the image (built for Linux), instead of the ones on your computer.
      # One line per node_modules folder in the image: without it, a folder from your computer (built for macOS or Windows) would be used instead.
      - /app/node_modules
      - /app/packages/domain/node_modules
      - /app/packages/web/node_modules
      - /app/packages/server/node_modules
    depends_on:
      # Start only after the migrations, so the tables exist. If a migration fails, the server doesn't start.
      instrument-migrate:
        condition: service_completed_successfully

  instrument-web:
    # The same image as "instrument-server", built there. "never": it only exists on your computer, so never look for it online.
    image: instrument-dev
    pull_policy: never
    # The MediaPipe files are copied again because the folder comes from your computer, which may not have them yet.
    command: sh -c "node scripts/copy-mediapipe-wasm.mjs && npm run dev -w @instrument/web -- --host 0.0.0.0"
    environment:
      # Vite forwards /api to the "instrument-server" container instead of 127.0.0.1.
      API_URL: http://instrument-server:3000
    volumes: *source
    ports:
      - "5173:5173"
    depends_on:
      - instrument-server

volumes:
  db-data:
